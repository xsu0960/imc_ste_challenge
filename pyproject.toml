[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imc-ste-challenge"
version = "0.1.0"
description = "STE-based noise-aware training framework for analog IMC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
organizer-tools = [
  "memintelli==0.0.1.3",
  "mpimpy==0.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
